name: Build SafeTube APK

on:
  push:
    branches:
      - "arena/01a0cf6f-safetube1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeTube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SafeTube-debug.apk
          gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create apk-latest --repo "$GITHUB_REPOSITORY" \
                 --title "SafeTube APK (latest build)" \
                 --notes "Installable debug APK built automatically from the fixed branch. Videos & Shorts playback fix included."
          gh release upload apk-latest SafeTube-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
